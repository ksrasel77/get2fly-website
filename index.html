<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get2Fly | Admin Dashboard</title>
  <meta name="theme-color" content="#0B2545">
  <link rel="icon" href="favicon.png">
  <meta name="description" content="Get2Fly Admin Dashboard">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Admin Role & Session Security Check -->
  <script>
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co'; // Replace with your Supabase URL
    const SUPABASE_ANON_KEY = 'sb_publishable_-RI5tBwN5GOdp-SixcCf2A_feSRH1P_'; // Your Publishable Key
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAdminAccess() {
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        window.location.href = 'index.html'; // Redirect to home if not logged in
        return;
      }

      // Check if user is admin
      const { data: profile, error } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (error || !profile || profile.role !== 'admin') {
        alert('Access denied. Administrator privileges required.');
        window.location.href = 'index.html';
      }
    }

    // Run security check immediately on load
    checkAdminAccess();
  </script>

  <style>
    /* Reset & CSS Variables */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --primary: #FF8A00; /* Get2Fly orange */
      --primary-dark: #E67A00;
      --brand-blue: #2196F3;
      --brand-dark: #0B2545;
      --accent-red: #f43f5e;
      --bg-light: #f8fafc;

    body {

    @media (min-width: 1024px) {
      body {

      max-width: 1200px;
      margin: 0 auto;
    }

    /* Navigation Header */

    .quick-services-section {

    .section-heading {

      font-weight: 800;

      box-shadow: 0 8px 20px rgba(0,0,0,0.08);

    .tile-icon {

      color: var(--text-main);

    .sort-btn {

    .book-ticket-btn {
      background: var(--brand-blue);
      color: #fff;
      border: none;

      border-radius: 8px;

      cursor: pointer;
      margin-top: 6px;
    }

    .book-ticket-btn:hover {
      background: #0369a1;
    }

    /* Popular Routes & Content Sections */
    .sec { padding: 36px 0; }
    .sec.alt { background: #fff; }
    .narrow { max-width: 760px; }
    .deal-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .deal-card { background: #fff; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .deal-btn, .contact-btn { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .deal-btn:hover, .contact-btn:hover { background: var(--primary-dark); }
    .contact-btn { margin: 4px; }
    .contact-btn.alt { background: var(--brand-blue); }

    .feat-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .feat { background: var(--bg-light); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; }
    .sec:not(.alt) .feat { background: #fff; }
    .feat > i { font-size: 1.5rem; color: var(--brand-blue); margin-bottom: 8px; }
    .feat h4 { margin-bottom: 4px; }
    .feat p { color: var(--text-muted); font-size: 0.9rem; }
    .step { display: inline-flex; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 800; align-items: center; justify-content: center; margin-bottom: 8px; }

    details { background: var(--bg-light); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    summary { font-weight: 700; cursor: pointer; }
    details p { margin-top: 8px; color: var(--text-muted); }

    /* Airport Drawer Modal */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;

      justify-content: center;
      align-items: flex-end;
    }

    @media (min-width: 768px) {
      .drawer-overlay {
        align-items: center;
      }
      .deal-grid { grid-template-columns: repeat(3, 1fr); }
      .feat-grid { grid-template-columns: repeat(4, 1fr); }

    .drawer-content {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      height: 90vh;
      border-radius: 24px 24px 0 0;

      flex-direction: column;

      display: flex;
      justify-content: space-between;
      align-items: center;

    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .close-drawer-btn {

      width: 32px;

      cursor: pointer;

      transform: translateY(-50%);

      font-size: 0.75rem;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.5px;

    .airport-list-item {

      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }

    .airport-list-item:hover {
      background: #f8fafc;
    }

    .airport-info h5 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .airport-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

      background: #f1f5f9;
      padding: 4px 10px;
